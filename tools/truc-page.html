<style>
:root{color-scheme:light;--bg:#f5f6f8;--panel:#fff;--line:#e3e6eb;--fg:#1c2230;--mut:#667085;--ok:#11845b;--okb:#e5f5ee;--warn:#b25e09;--warnb:#fff4e0;--bad:#c4321f;--badb:#fde9e6;--acc:#2A52BE;--accb:#e8edf9;--red:#ED2E38;--r:10px}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
.w{max-width:1200px;margin:auto;padding:16px 16px 60px}
header{display:flex;align-items:center;gap:14px;padding:6px 0 4px}
.flag{display:flex;flex-direction:column;width:6px;height:44px;border-radius:3px;overflow:hidden;flex:none}.flag i{flex:1}.flag i:nth-child(1){background:#2A52BE}.flag i:nth-child(2){background:#5b7fd4}.flag i:nth-child(3){background:#9db4e8}

label.full{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:13px;color:var(--mut)}label.full textarea,label.full input{font:inherit;color:var(--fg);padding:8px;border:1px solid var(--line);border-radius:8px}

.heat td.q{text-align:center;font-weight:600;width:58px}.heat{table-layout:auto}
.steps{margin:6px 0;padding-left:20px}.steps li{margin:4px 0}
.copy{border:1px solid var(--line);background:#fff;border-radius:6px;font:inherit;font-size:12px;padding:2px 8px;cursor:pointer;margin-left:6px}

  font:inherit;font-size:12px;font-weight:600;padding:3px 10px;cursor:pointer;margin-left:6px}

.hint{background:var(--accb);border-radius:8px;padding:10px 12px;font-size:13.5px}
.bars2 .row{display:grid;grid-template-columns:150px 1fr 84px;gap:8px;align-items:center;font-size:13px;margin:5px 0}

details summary{cursor:pointer;font-weight:600}
@media(max-width:640px){.say{grid-template-columns:1fr}.item{grid-template-columns:1fr}.hide-m{display:none}.kpi .v{font-size:17px}header h1{font-size:25px}}


.tier{display:inline-block;min-width:26px;text-align:center;font-weight:700;font-size:12.5px;padding:2px 7px;border-radius:6px}

.ins{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}

.mx td.q{text-align:center;font-weight:600;width:64px}.mx tr.tA td:first-child{border-left:3px solid #17703a}.mx tr.tB td:first-child{border-left:3px solid #c98a00}.mx tr.tC td:first-child{border-left:3px solid #b42318}

.loi3 .lr>div{padding:9px 12px}.loi3 .lr>div+div{border-left:1px solid #eef0f3}
.loi3 .lh{border-top:0;background:#f1f3f6;font-size:12px;font-weight:600;color:var(--mut)}.loi3 .lh>div{padding:6px 12px}
.loi3 .lt{font-weight:700}.loi3 .lb{font-size:12px;color:var(--mut);font-weight:600;margin-top:6px}.loi3 .lb:first-child{margin-top:0}

.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.t-CHUA_TRA_LOI{background:var(--badb);color:var(--bad)}
.src{font-size:12px;color:var(--mut);margin-top:8px}
.ins dl{margin:0}.ins dt{font-size:12px;font-weight:700;color:var(--fg);margin-top:8px}.ins dt:first-child{margin-top:0}.ins dd{margin:2px 0 0;line-height:1.45}
tr.pvm td{border-bottom:0;padding-bottom:3px}
tr.pvs td{padding:0 8px 10px;background:#fafbfd;font-size:13px}
tr.pvs .pvl{font-size:12px;font-weight:600;color:var(--mut)}
.pvul{margin:2px 0 0;padding-left:18px}.pvul li{margin:2px 0;color:var(--warn)}.pvul li.r{color:var(--bad)}
tr.pick td{background:#eef3ff}

.gbar{position:static;display:grid;grid-template-columns:1fr 1fr;gap:8px}.gbar label{min-width:0}.gbar select{min-width:0;width:100%}.gbar .note{grid-column:1/-1}

.loi3 .lr{grid-template-columns:1fr}.loi3 .lr>div+div{border-left:0;border-top:1px dashed #eef0f3}.loi3 .lh{display:none}

}

.ar{font-weight:700;margin-left:4px}.ar.up{color:var(--ok)}.ar.dn{color:var(--bad)}.ar.eq{color:var(--fg)}

<script>
"use strict";

/* ---------- 8 tiêu chí ---------- */
var CRIT=[
 {id:"q1",n:"Tỉ lệ xin số",goal:32,dir:"up",u:"%",who:"Máy",
  d:"SĐT thô ÷ inbox mới phát sinh trong kỳ. Khách cũ nhắn lại không tính vào mẫu số, kể cả khi họ bấm vào một quảng cáo mới."},
 {id:"q2",n:"Ra số trong 6h",goal:24,dir:"up",u:"%",who:"Máy",
  d:"Khách để SĐT trong 6 giờ kể từ tin đầu của họ ÷ inbox mới đã đủ 6 giờ."},
 {id:"q3",n:"Ra số trong 24h",goal:32,dir:"up",u:"%",who:"Máy",
  d:"Như Q2 nhưng cửa sổ 24 giờ. Inbox chưa đủ 24h không nằm trong mẫu số."},
 {id:"q4",n:"Ra số trong 48h",goal:37,dir:"up",u:"%",who:"Máy",
  d:"Như Q2 nhưng cửa sổ 48 giờ. Kỳ 3 ngày nên chỉ 632 inbox đủ 48h."},
 {id:"q5",n:"SLA toàn hội thoại ≤ 5 phút",goal:85,dir:"up",u:"%",who:"Máy",
  d:"Hội thoại mà MỌI lượt khách phải chờ đều dưới 5 phút — không chỉ tin đầu. Chỉ tính lượt chờ bắt đầu trong khung trực 08:15–21:30."},
 {id:"q6",n:"Xử lí từ chối",goal:1.5,dir:"up",u:"",who:"AI",

 {id:"q7",n:"Tuân thủ kịch bản",goal:1.5,dir:"up",u:"",who:"AI",

function arrow(cur,prev){
  if(cur===null||cur===undefined||prev===null||prev===undefined) return "";
  var d=cur-prev;
  if(Math.abs(d)<0.5) return ' <span class="ar eq">=</span>';
  return ' <span class="ar '+(d>0?"up":"dn")+'">'+(d>0?"▲":"▼")
    +Math.abs(d).toFixed(1).replace(".",",")+'</span>';
}

var TSEL="";
function tabThe(){
  return '<div class="card"><div class="bar"><label>Chọn mã nhân viên của bạn'
   +'<select id="tNv"></select></label></div></div><div id="tBody"></div>';
}
function meter(c,val,teamVal,note){
  if(val===null||val===undefined)
    return '<div class="meter"><div class="top"><span>'+esc(c.n)+'</span><span>—</span></div>'
      +'<div class="trk"></div><div class="sub2">'
      +(note||"chưa đủ 20 hội thoại để công bố")+'</div></div>';
  var max=c.u==="%"?100:2;
  var w=Math.max(1,Math.min(100,val/max*100));
  var col=val>=c.goal?"var(--ok)":(val>=c.goal*0.8?"#e0a32e":"var(--bad)");
  var f=function(v){return c.u==="%"?pc(v):n2(v);};
  return '<div class="meter"><div class="top"><span>'+esc(c.n)+'</span><b>'+f(val)+'</b></div>'
   +'<div class="trk"><div class="fill" style="width:'+w.toFixed(1)+'%;background:'+col+'"></div>'
   +'<div class="tgt" style="left:'+Math.min(100,c.goal/max*100).toFixed(1)+'%"></div>'
   +'<div class="avg" style="left:'+Math.min(100,(teamVal||0)/max*100).toFixed(1)+'%"></div></div>'
   +'<div class="sub2">Mục tiêu ≥ '+f(c.goal)+' · TB đội '+f(teamVal)+(note?' · '+note:'')
   +'</div></div>';
}

function kbBest(k){
  var a=S().nv.filter(function(x){return x[k]!==null&&x[k]!==undefined&&x.n>=20;});

}

function renderKN(){
  var box=el("knList"); if(!box) return;

    box.innerHTML='<p class="note">'+(KNNOTE||"Chưa kết nối được nơi lưu kiến nghị.")+'</p>';

function sendKN(){
  var vd=el("knVd").value, need=el("knNeed").value.trim();
  if(vd.indexOf("Chọn")>=0||!need){
    el("knMsg").textContent="Cần chọn vấn đề nghi ngờ và viết mô tả cụ thể."; return; }
  if(!DB){ el("knMsg").textContent="Chưa kết nối được nơi lưu."; return; }
  var body={dv:el("knDv").value,nv:el("knNv").value,mk:el("knMk").value,kg:el("knKg").value,
            vd:vd,gap:el("knGap").value,need:need,ht:el("knHt").value.trim(),
            tt:"Mới",at:new Date().toISOString()};
  if(ME) body.by=ME;
  DB.collection("kiennghi").doc().set(body).then(function(){
    el("knMsg").textContent="Đã gửi. Lần chạy sau sẽ lọc hội thoại theo phạm vi này.";
    el("knNeed").value=""; el("knHt").value="";
  },function(){ el("knMsg").textContent=
    "Không gửi được — tài khoản này không có quyền Editor trên trang."; });
}
function bootDB(){
  if(!(window.claude&&window.claude.use)){
    KNNOTE="Trang đang mở ở chế độ chỉ đọc nên chưa gửi được kiến nghị."; return; }
  var timer=setTimeout(function(){
    if(!DB){ KNNOTE="Chưa kết nối được nơi lưu kiến nghị; các tab khác vẫn dùng bình thường.";
      renderKN(); } },10000);
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    DB=r[0]; var u=r[1]; clearTimeout(timer);
    if(!DB){ KNNOTE="Trang đang mở ở chế độ chỉ đọc nên chưa gửi được kiến nghị."; renderKN(); return; }
    if(u){ try{ CANEDIT=!!u.canEdit(); }catch(e){}
           try{ u.id().then(function(x){ME=x;},function(){}); }catch(e){} }
    DB.collection("kiennghi").onSnapshot(function(snap){
      KN=snap.docs.map(function(d){return d.data()||{};}); renderKN();
    },function(){ KNNOTE="Không đọc được kiến nghị đã lưu."; renderKN(); });
    renderKN();
  },function(){ clearTimeout(timer);
    KNNOTE="Trang đang mở ở chế độ chỉ đọc nên chưa gửi được kiến nghị."; renderKN(); });
}

     nên người chọn biết trước mình sắp xem bao nhiêu hội thoại. */
  function dem(them){
    var o={dim:CURK,d1:FLT.d1,d2:FLT.d2,page:FLT.page,kg:FLT.kg,nguon:FLT.nguon};
    for(var k in them) o[k]=them[k];
    return AGG.loc(o).moi.length;
  }
  var TU=AGG.tu();

  el("fD1").innerHTML=DAYS.map(function(d,i){
    return '<option value="'+i+'"'+(i===FLT.d1?" selected":"")+'>'+esc(d)+'</option>';}).join("");
  el("fD2").innerHTML=DAYS.map(function(d,i){
    return '<option value="'+i+'"'+(i===FLT.d2?" selected":"")+'>'+esc(d)+'</option>';}).join("");
  el("fD1").disabled=el("fD2").disabled=DAYS.length<2;
  if(DAYS.length<2){ el("fD1").title=el("fD2").title="Kỳ chỉ có một ngày"; }

  function oLoc(id, nhan, ten, cot, dsach, ghiChu){
    var cur=FLT[ten];
    var h='<option value="-1">'+nhan+'</option>';
    dsach.forEach(function(v){
      var i=cot.indexOf(v);
      if(i<0) return;
      var o={}; o[ten]=i;
      var n=dem(o);
      if(!n) return;
      h+='<option value="'+i+'"'+(cur===i?" selected":"")+'>'+esc(v)+' · '+n
        +(ghiChu?ghiChu(i):"")+'</option>';
    });
    el(id).innerHTML=h;
    el(id).disabled=false;
  }
  var PV=AGG.phamVi({d1:FLT.d1,d2:FLT.d2});
  oLoc("fPage","Tất cả page ("+(KYI.npage||1)+")","page",TU.page,TU.page,function(i){
    var n=PV.phu[i]||0;
    return n<PV.days.length ? " · "+n+"/"+PV.days.length+" ngày" : "";
  });
  oLoc("fKg","Tất cả khung giờ","kg",TU.kg,TU.kg.slice().sort());
  oLoc("fNguon","Tất cả nguồn","nguon",TU.nguon,TU.nguon);

  var dv='<option value="all">Tất cả dịch vụ</option>';
  SLICES.dvOpts.forEach(function(o){
    var k="dv:"+o[0], n=dem({dim:k});
    dv+='<option value="'+k+'"'+(n>=40?"":" disabled")+'>'+esc(o[1])
      +(n>=40?" · "+n:" · "+n+" ht, dưới 40")+'</option>';
  });
  el("fDv").innerHTML=dv;
  var mk='<option value="all">Tất cả thị trường</option>';
  SLICES.mktOpts.forEach(function(o){
    var k="mkt:"+o[0], n=dem({dim:k});
    mk+='<option value="'+k+'"'+(n>=40?"":" disabled")+'>'+esc(o[1])
      +(n>=40?" · "+n:" · "+n+" ht, dưới 40")+'</option>';
  });
  el("fMkt").innerHTML=mk;
  syncFilters();
}
function syncFilters(){
  el("fDv").value = CURK.indexOf("dv:")===0 ? CURK : "all";
  el("fMkt").value = CURK.indexOf("mkt:")===0 ? CURK : "all";
  var TUx=AGG.tu(), t=T(), tab=TABS[CUR].id;
  var ds=[];
  if(locNgay()||DAYS.length>1) ds.push(DAYSEL().length===1?DAYSEL()[0]:DAYSEL()[0]+"–"+DAYSEL()[DAYSEL().length-1]);
  if(FLT.page>=0) ds.push("page "+TUx.page[FLT.page]);
  if(FLT.kg>=0) ds.push(TUx.kg[FLT.kg].replace("-","–")+"h");
  if(FLT.nguon>=0) ds.push(TUx.nguon[FLT.nguon]);
  if(CURK!=="all") ds.push(nhanLat(CURK));
  var base='Đang xem: <b>'+(ds.length?esc(ds.join(" · ")):"toàn Kangnam")+'</b> · '+t.n
    +' inbox mới · '+t.sdt+' SĐT';
  if(tab==="team"||tab==="the"){
    el("scope").innerHTML=base
      +(filtered()?' · lọc một chiều: chọn dịch vụ sẽ bỏ thị trường và ngược lại':'');
  }else{
    el("scope").innerHTML=base+' — <b>bộ lọc chỉ áp cho tab Sức khoẻ team và Thẻ điểm nhân viên</b>; '
      +'tab này luôn tính trên toàn kỳ.';
  }
}

/* ================= điều hướng ================= */
var TABS=[
 {id:"team",t:"Sức khoẻ team",s:"Toàn đội · ma trận A/B/C",build:tabTeam,after:renderTeam},
 {id:"the",t:"Thẻ điểm nhân viên",s:"Từng nhân viên",build:tabThe,after:function(){
    var sel=el("tNv");
    sel.innerHTML=S().nv.map(function(p){
      return '<option value="'+p.nv+'">'+p.hang+' · '+p.nv+' · '+p.n+' inbox</option>';}).join("");
    if(TSEL&&S().nv.filter(function(p){return p.nv===TSEL;}).length) sel.value=TSEL;
    TSEL=sel.value; renderThe();}},
 {id:"kb",t:"Kịch bản",s:"Theo nhân viên",build:tabKB,after:renderKB},
 {id:"viec",t:"Việc cần làm",s:"NV · page · dịch vụ · thị trường",build:tabViec,after:renderViec},
 {id:"kn",t:"Kiến nghị QC/QA",s:"Quản lý gửi",build:tabKN,after:renderKN},
 {id:"luat",t:"Cách tính & luật",s:"Đọc 1 lần",build:tabLuat,after:function(){}}
];
var CUR=0;
function paintTabs(){
  el("tabs").innerHTML=TABS.map(function(t,i){
    return '<button class="tab" role="tab" data-i="'+i+'" aria-selected="'+(i===CUR)+'">'
      +'<b>'+esc(t.t)+'</b><span>'+esc(t.s)+'</span></button>';}).join("");
}
function show(i){
  CUR=i; paintTabs();
  var t=TABS[i];
  el("panels").innerHTML='<div class="pg on">'+t.build()+'</div>';
  if(t.after) t.after();
  syncFilters();
  try{ history.replaceState(null,"","#"+t.id); }catch(e){}
}

document.addEventListener("click",function(e){
  var tgt=e.target;
  var th=tgt.closest?tgt.closest("th[data-k]"):null;
  if(th){ var k=th.dataset.k;
    if(SORT.k===k) SORT.dir=-SORT.dir; else { SORT.k=k; SORT.dir=(k==="nv"||k==="rank")?1:-1; }
    renderMatrix(); return; }
  var tr=tgt.closest?tgt.closest("tr.click"):null;
  if(tr&&tr.dataset.nv){ TSEL=tr.dataset.nv; show(1); return; }
  var b=tgt.closest?tgt.closest("button"):null; if(!b) return;
  if(b.classList.contains("tab")&&b.dataset.i!==undefined){ show(+b.dataset.i); return; }
  if(b.dataset.copy!==undefined){ copyText(b.dataset.copy); return; }
  if(b.dataset.sl!==undefined){ SLK=b.dataset.sl; renderSlice(); return; }
  if(b.dataset.kb!==undefined){ KBSEL=+b.dataset.kb; renderKB(); return; }
  if(b.dataset.v!==undefined){ VSEL=b.dataset.v; renderViec(); return; }
  if(b.id==="knSend"){ sendKN(); return; }
  if(b.id==="pvFix"){
    var v=AGG.phamVi({d1:FLT.d1,d2:FLT.d2});
    if(v.chung.length===1){ FLT.page=v.chung[0]; fillFilters(); show(CUR); }
    return;
  }
  if(b.id==="fReset"){
    CURK="all"; FLT={d1:0,d2:DAYS.length-1,page:-1,kg:-1,nguon:-1};
    fillFilters(); show(CUR); return;
  }
});
document.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="tNv"){ TSEL=e.target.value; renderThe(); return; }
  if(id==="knFst"){ renderKN(); return; }
  if(id==="kbNv"){ KBSEL=e.target.value; renderKB(); return; }
  if(id==="fDv"||id==="fMkt"){
    CURK=e.target.value;                 /* chọn một chiều: chiều kia tự về Tất cả */
    fillFilters(); show(CUR); return;
  }
  if(id==="fD1"||id==="fD2"){
    FLT.d1=+el("fD1").value; FLT.d2=+el("fD2").value;
    if(FLT.d1>FLT.d2){ if(id==="fD1") FLT.d2=FLT.d1; else FLT.d1=FLT.d2; }
    fillFilters(); show(CUR); return;
  }
  if(id==="fPage"||id==="fKg"||id==="fNguon"){
    FLT[{fPage:"page",fKg:"kg",fNguon:"nguon"}[id]]=+e.target.value;
    fillFilters(); show(CUR); return;
  }
});

(function(){
  el("sub").innerHTML='Khách nhắn đầu <b>'+KYI.nhan+'</b> · '+n0(V2.team.tong_ht)+' hội thoại · '
   +'<b>'+n0(V2.team.n)+' inbox mới</b> (đã trừ '+n0(V2.team.khach_cu)+' khách cũ) · '
   +'SLA khung <b>08:15–21:30</b> · '+V2.nv.length+' nhân viên · '+(KYI.npage||1)+' page';
  el("foot").innerHTML='<b>Nguồn và cách tính.</b> Số liệu tính bằng script trên bản xuất hội thoại '
   +'Caresoft — '+n0(V2.team.tong_ht)+' hội thoại hợp lệ, '+n0(V2.team.n)+' inbox mới sau khi trừ '
   +n0(V2.team.khach_cu)+' khách cũ. SLA, khách cũ và thị trường tính lại '
   +'trực tiếp từ file hội thoại; mỗi lát cắt dịch vụ / thị trường được tính riêng chứ không chia tỉ '
   +'lệ từ số tổng. Điểm Q6–Q7 do AI đọc 135 hội thoại lấy mẫu phân tầng. Tên khách và số điện thoại '
   +'đã được che trước khi xử lý. Kangnam · kỳ '+KYI.nhan+' · số do agent tự chấm, QL chấm lại.';
  fillFilters();
  var hash=(location.hash||"").replace("#","");
  var idx=0; TABS.forEach(function(t,i){ if(t.id===hash) idx=i; });
  show(idx);
  bootDB();
})();
</script>
